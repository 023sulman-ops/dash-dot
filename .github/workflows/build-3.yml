name: Build APK v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses (SDK is already on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Install packages
        run: |
          npm install
          npm install --no-save @fontsource/fredoka || true

      - name: Fix slow start (non-blocking font, startup error message)
        run: |
          python3 - <<'PYFIX'
          p='dash-dot.html'
          s=open(p).read()
          # 1) make the online font non-blocking (it used to stop the game from starting on slow internet)
          if 'onload="this.media' not in s:
              s=s.replace('display=swap" rel="stylesheet">','display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">',1)
          # 2) no empty dark box while the game is starting
          if '#box:empty' not in s:
              s=s.replace('#box.home{','#box:empty{display:none}\n#box.home{',1)
          # 3) if something ever fails at start, show the reason on screen
          if 'Startup error' not in s:
              s=s.replace('</head>','<script>window.addEventListener("error",function(e){var b=document.getElementById("box");if(b){b.style.display="block";b.style.fontSize="12px";b.style.maxWidth="90%";b.textContent="Startup error: "+e.message+" (line "+e.lineno+")"}})</script>\n</head>',1)
          open(p,'w').write(s)
          print('startup fixes applied')
          PYFIX

      - name: Prepare web files
        run: node setup.js web

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android project (AdMob id, icon, portrait)
        run: node setup.js android

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
