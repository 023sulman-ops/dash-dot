name: Build APK v5

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Install packages
        run: |
          npm install
          npm install --no-save @fontsource/fredoka || true

      - name: Fix start-up, ads and loading screen
        run: |
          python3 - <<'PYFIX'
          p='dash-dot.html'
          s=open(p).read()
          if 'onload="this.media' not in s:
              s=s.replace('display=swap" rel="stylesheet">','''display=swap" rel="stylesheet" media="print" onload="this.media='all'">''',1)
          if '#box:empty' not in s:
              s=s.replace('#box.home{','#box:empty{display:none} #box.home{',1)
          if 'Startup error' not in s:
              s=s.replace('</head>','''<script>window.addEventListener("error",function(e){var b=document.getElementById("box");if(b){b.style.display="block";b.style.fontSize="12px";b.textContent="Startup error: "+e.message+" (line "+e.lineno+")"}})</script></head>''',1)
          def rep(o,n):
              global s
              if o in s: s=s.replace(o,n)
          rep("const AdMob=NATIVE?Capacitor.registerPlugin('AdMob'):null;",'''function plug(n){
           const C=window.Capacitor;if(!C)return null;
           try{if(typeof C.registerPlugin==='function')return C.registerPlugin(n)}catch(e){}
           if(C.Plugins&&C.Plugins[n])return C.Plugins[n];
           if(typeof C.nativePromise==='function')return new Proxy({},{get:(_,m)=>m==='addListener'?(ev,cb)=>{try{C.nativeCallback(n,'addListener',{eventName:ev},cb)}catch(e){}return Promise.resolve()}:(o)=>C.nativePromise(n,m,o||{})});
           return null;
          }
          const AdMob=NATIVE?plug('AdMob'):null;''')
          rep("  if(AdMob){try{AdMob.showInterstitial().catch(()=>{})}catch(e){}return}","  if(AdMob){try{AdMob.showInterstitial().catch(()=>{})}catch(e){}return}\n  if(NATIVE)return;")
          rep("  if(!AdMob){done();return}","  if(!AdMob){if(NATIVE){toast('Ads are not available right now.');return}done();return}")
          rep("const A=Capacitor.registerPlugin('App');","const A=plug('App');")
          open(p,'w').write(s)
          print('fixes applied')
          PYFIX
          python3 - <<'PYLOAD'
          p='dash-dot.html'
          s=open(p).read()
          if 'id="load"' not in s:
              css='''#load{position:fixed;inset:0;z-index:20;background:linear-gradient(#1d2b53,#7e2553);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s;font-family:Fredoka,ui-rounded,system-ui,sans-serif;color:#fff1e8}
          #load .lg{font-size:46px;font-weight:700;letter-spacing:1px;text-shadow:0 5px 0 rgba(0,0,0,.35);transform:rotate(-3deg)}
          #load svg{width:130px;height:130px;animation:hop .7s ease-in-out infinite}
          @keyframes hop{50%{transform:translateY(-22px)}}
          #load .bar{width:min(240px,60vw);height:14px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
          #lb{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffec27,#ffa300);animation:ld 1.4s ease-out forwards;transition:width .25s}
          @keyframes ld{to{width:90%}}
          #load p{margin:0;font-size:17px;opacity:.9;font-weight:500}
          #load p::after{content:"";animation:dots 1.2s steps(1) infinite}
          @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
          '''
              html='''
          <div id="load"><div class="lg"><span style="color:#ffec27">D</span><span style="color:#ff77a8">A</span><span style="color:#29adff">S</span><span style="color:#4cd964">H</span> <span style="color:#ffa300">D</span><span style="color:#ff5d5d">O</span><span style="color:#ffec27">T</span></div><svg viewBox="0 0 100 100"><polygon points="14,40 18,8 44,28" fill="#c9ccdf"/><polygon points="86,40 82,8 56,28" fill="#c9ccdf"/><polygon points="19,32 21,16 35,27" fill="#ff9ebf"/><polygon points="81,32 79,16 65,27" fill="#ff9ebf"/><ellipse cx="50" cy="58" rx="38" ry="32" fill="#c9ccdf"/><circle cx="35" cy="56" r="6" fill="#1d1a2b"/><circle cx="65" cy="56" r="6" fill="#1d1a2b"/><circle cx="37" cy="54" r="2" fill="#fff"/><circle cx="67" cy="54" r="2" fill="#fff"/><ellipse cx="22" cy="68" rx="6" ry="4" fill="#ff77a8" opacity=".6"/><ellipse cx="78" cy="68" rx="6" ry="4" fill="#ff77a8" opacity=".6"/><polygon points="45,66 55,66 50,72" fill="#ff77a8"/></svg><div class="bar"><i id="lb"></i></div><p>Loading</p></div>
          '''
              js='''(function(){var L=document.getElementById("load");if(!L)return;setTimeout(function(){var b=document.getElementById("lb");b.style.animation="none";b.style.width="100%";setTimeout(function(){L.style.opacity=0;setTimeout(function(){L.remove()},450)},300)},Math.max(0,1400-performance.now()))})();
          '''
              s=s.replace('</style>',css+'</style>',1)
              s=s.replace('<body>','<body>'+html,1)
              i=s.rfind('</script>');s=s[:i]+js+s[i:]
              s=s.replace('var b=document.getElementById("box");','var l=document.getElementById("load");if(l)l.style.display="none";var b=document.getElementById("box");',1)
              print('loading screen added')
          else:
              print('loading screen already there')
          open(p,'w').write(s)
          PYLOAD

      - name: Prepare web files
        run: node setup.js web

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android project
        run: node setup.js android

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
