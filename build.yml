name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses (SDK is already on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Install packages
        run: |
          npm install
          npm install --no-save @fontsource/fredoka || true

      - name: Prepare web files
        run: node setup.js web

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android project (AdMob id, icon, portrait)
        run: node setup.js android

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
