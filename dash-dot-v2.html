const DOC={about:`<p><b>Dash Dot</b> &middot; Version 1.0</p>
<p>A fun, simple endless runner. Pick a cute pet (Cat, Dog, Hen, Cow, Dino, Panda, Bunny or Duck), jump over obstacles, collect gold paw coins, and unlock new pets and outfits in the shop.</p>
<p><b>About the developer</b><br>Hi! I am {{N}}, an independent game developer from {{C}}. I made Dash Dot as a small, friendly game that anyone can enjoy in a short break. The game is free and supported by ads. Thank you for playing!</p>
<p><b>Contact</b><br>Feedback, bugs or ideas: {{E}}</p>

const doc=k=>DOC[k].replace(/\{\{N\}\}/g,DEV.n).replace(/\{\{C\}\}/g,DEV.c).replace(/\{\{E\}\}/g,DEV.e);
let scr='';
const $=id=>document.getElementById(id);
function drawHome(){
 const hc=scr==='home'&&$('hp');if(!hc)return;
 const c=hc.getContext('2d'),t=last/1000,b=Math.abs(Math.sin(t*3.2))*10,s=3.4;
 c.clearRect(0,0,200,220);c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(100,192,54-b,8-b/6,0,0,7);c.fill();
 c.save();c.translate(100-17*s,186-34*s-b);c.scale(s,s);drawAnimal(c,skin,0,0,b>5?4:0,hap>0?2:last%2600<140?1:0,outfit);c.restore();
}
const btn=(id,t,c)=>'<button id="'+id+'"'+(c?' class="'+c+'"':'')+'>'+t+'</button>';
const item=(t,id,nm,sub,on)=>'<button class="sk'+(on?' on':'')+'" data-t="'+t+'" data-id="'+id+'"><canvas width="52" height="52"></canvas><span>'+nm+(sub!==''?'<br>'+sub:'')+'</span></button>';
const DPR=Math.max(1,window.devicePixelRatio||1);
function hd(k,w,h){k.width=w*DPR;k.height=h*DPR;k.style.width=w+'px';k.style.height=h+'px';const c=k.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);return c}
function paintAll(){document.querySelectorAll('.sk').forEach(b=>{const t=b.dataset.t,id=b.dataset.id,c=hd(b.querySelector('canvas'),52,52);c.save();c.translate(13,14);c.scale(.8,.8);drawAnimal(c,t==='pet'?id:skin,0,0,0,2,t==='acc'?id:t==='pet'?outfit:'');c.restore()})}
function pick(t,id,mode){
 if(mode==='skins'){if(t==='pet')skin=id;else outfit=id;sv('dd_skin',skin);sv('dd_acc',outfit);voice(skin);show('skins');return}
 const D=t==='pet'?PETS:ACCS,pr=D[id][1];
 if(own.includes(id))msg='Already yours! Equip it in SKINS';
 else if(wallet>=pr){wallet-=pr;own.push(id);saveW();sv('dd_own',JSON.stringify(own));if(t==='pet')skin=id;else outfit=id;sv('dd_skin',skin);sv('dd_acc',outfit);msg='Bought '+D[id][0]+'!';voice(skin)}
 else msg='Need '+(pr-wallet)+' more coins';
 show('shop');
}
function show(mode){
 panel.style.display='flex';let h;box.className=mode==='home'?'home':'';scr=mode;
 const cl='<p>Coins: '+wallet+'</p>',fr=btn('fr','+20 COINS (WATCH AD)');
 if(mode==='home'){
  const L='DASH DOT'.split('').map((ch,i)=>'<span style="color:'+['#ffec27','#ff77a8','#29adff','#4cd964','#ffa300','#ff5d5d'][i%6]+'">'+ch+'</span>').join('');
  const ib=(id,ic,tx,bg,sh,bd)=>'<button class="ib" id="'+id+'" style="background:'+bg+';box-shadow:0 4px 0 '+sh+'"><i>'+ic+'</i>'+tx+(bd?'<em class="bdg">'+bd+'</em>':'')+'</button>';
  h='<div class="hm"><div class="chip"><canvas class="cn" id="cn" width="48" height="48"></canvas>'+wallet+'</div><h1 class="logo">'+L+'</h1><canvas id="hp" width="200" height="220"></canvas><div class="side">'+ib('bSk','\u{1F43E}','SKINS','#ff77a8','#c2457a')+ib('bSh','\u{1F6D2}','SHOP','#4cd964','#2a9a40')+ib('fr','\u{1F381}','FREE','#ffa300','#b87000','+20')+ib('bSt','\u2699\uFE0F','SETTINGS','#c2c3d7','#8a8aa0')+'</div>'+btn('go','PLAY','play')+'</div>'}
 else if(mode==='skins')h='<h1>SKINS</h1><p>PET</p><div class="gr">'+own.filter(k=>PETS[k]).map(k=>item('pet',k,PETS[k][0],'',k===skin)).join('')+'</div><p>OUTFIT</p><div class="gr">'+item('none','','NONE','',outfit==='')+own.filter(k=>ACCS[k]).map(k=>item('acc',k,ACCS[k][0],'',k===outfit)).join('')+'</div>'+btn('bk','BACK');
 else if(mode==='shop'){const row=(t,D)=>Object.keys(D).map(k=>item(t,k,D[k][0],own.includes(k)?'OWNED':D[k][1]+'c',false)).join('');h='<h1>SHOP</h1>'+cl+'<p>'+msg+'</p><div class="gr">'+row('pet',PETS)+row('acc',ACCS)+'</div>'+fr+btn('bk','BACK')}
 else if(mode==='settings')h='<h1>SETTINGS</h1>'+btn('s1','SOUND: '+(snd?'ON':'OFF'),'alt')+btn('s2','MUSIC: '+(mus?'ON':'OFF'),'alt')+btn('s3','VIBRATION: '+(vib?'ON':'OFF'),'alt')+'<div class="row">'+btn('a1','ABOUT','alt')+btn('a2','PRIVACY','alt')+btn('a3','TERMS','alt')+'</div>'+btn('bk','BACK');
 else if(mode==='about'||mode==='privacy'||mode==='terms')h='<h1>'+{about:'ABOUT',privacy:'PRIVACY POLICY',terms:'TERMS'}[mode]+'</h1><div class="tx">'+doc(mode)+'</div>'+btn('bkS','BACK');
 else if(mode==='pause')h='<h1>PAUSED</h1>'+btn('rs','RESUME')+btn('hm','HOME','alt');
  else h='<h1>GAME OVER</h1><p>'+(newBest?'NEW BEST!<br>':'')+'Score '+Math.floor(score)+'<br>Best '+Math.floor(best)+'<br>Coins +'+runCoins+' (total '+wallet+')</p>'+btn('go','PLAY AGAIN')+(runCoins>0&&!doubled?btn('dbl','DOUBLE COINS (AD)','alt'):'')+(canRev?btn('rv','REVIVE (WATCH AD)','alt'):'')+btn('hm','HOME','alt');
 box.innerHTML=h;
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=ev=>{ev.stopPropagation();f()}};
 on('go',()=>{reset();st='play';scr='';mStep=0;musicStart();panel.style.display='none'});
 on('bSk',()=>show('skins'));on('bSh',()=>{msg='';show('shop')});on('bSt',()=>show('settings'));on('bk',()=>show('home'));
 on('hm',()=>{musicStop();reset();st='ready';show('home')});
  on('rs',()=>{st='play';scr='';musicStart();panel.style.display='none'});
 on('fr',()=>Ads.rewarded(()=>{wallet+=20;saveW();msg='+20 coins!';beep(900,.1,'triangle');show(mode)}));
 on('a1',()=>show('about'));on('a2',()=>show('privacy'));on('a3',()=>show('terms'));on('bkS',()=>show('settings'));
 on('s1',()=>{snd=!snd;sv('dd_snd',snd?1:0);show('settings')});
 on('s2',()=>{mus=!mus;sv('dd_mus',mus?'1':'0');show('settings')});
 on('s3',()=>{vib=!vib;sv('dd_vib',vib?1:0);show('settings')});
 on('dbl',()=>Ads.rewarded(()=>{wallet+=runCoins;runCoins*=2;doubled=true;saveW();show('over')}));
 on('rv',()=>Ads.rewarded(()=>{scr='';obs=obs.filter(o=>o.x>260);canRev=false;inv=1.5;st='play';musicStart();panel.style.display='none'}));
 paintAll();
 const cn=$('cn');if(cn)gcoin(hd(cn,24,24),12,12,11);
 const hp=$('hp');if(hp){hd(hp,200,220);hp.onpointerdown=()=>{hap=.9;voice(skin)}};
 document.querySelectorAll('.sk').forEach(b=>b.onclick=ev=>{ev.stopPropagation();pick(b.dataset.t,b.dataset.id,mode)});
}
show('home');
setTimeout(()=>Ads.init(),500);
if(NATIVE){try{const A=plug('App');A.addListener('backButton',()=>{
 if(st==='play'){st='pause';musicStop();show('pause')}
 else if(scr==='home')A.exitApp();
 else if(scr==='about'||scr==='privacy'||scr==='terms')show('settings');
 else if(scr==='pause'){st='play';scr='';musicStart();panel.style.display='none'}
 else{musicStop();reset();st='ready';show('home')}
})}catch(e){}}

function burst(x,y,n,c){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*280,vy:-Math.random()*240,l:.4+Math.random()*.4,c})}
function jump(){if(st!=='play')return;if(p.g){p.vy=-640;p.g=false;p.j=1;burst(p.x+17,G,6,'#c2c3c7');beep(520,.08)}else if(p.j<2){p.j=2;p.vy=-580;burst(p.x+17,p.y+34,10,acc);beep(760,.08)}}
stage.addEventListener('pointerdown',e=>{if(!e.target.closest('button'))jump()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});

function die(){
 st='over';musicStop();overs++;beep(120,.3,'sawtooth');shake=.4;setTimeout(()=>voice(skin,1),250);saveW();burst(p.x+17,p.y+17,30,hero);burst(p.x+17,p.y+17,12,hurt);try{vib&&navigator.vibrate&&navigator.vibrate(90)}catch(e){}newBest=score>best;
 if(score>best){best=score;try{localStorage.setItem('dd_best',best)}catch(e){}}
 show('over');
 if(overs%3===0)setTimeout(()=>{if(st==='over')Ads.interstitial()},700);
}

function update(dt){
 dist+=(st==='play'?speed:60)*dt;
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=900*dt;q.l-=dt}
 parts=parts.filter(q=>q.l>0);
 if(shake>0)shake-=dt;if(flash>0)flash-=dt;
 if(hap>0)hap-=dt;if(st==='over'&&p.y<G-p.h){p.vy+=1900*dt;p.y=Math.min(G-p.h,p.y+p.vy*dt)}
 if(st!=='play')return;
 speed=Math.min(520,speed+9*dt);score+=dt*speed/40;
 if(score>=nextMile){nextMile+=100;flash=1.4;hap=1;speed=Math.min(520,speed+18);[0,1,2].forEach(i=>setTimeout(()=>beep(520+i*180,.1,'triangle'),i*90))}
 p.vy+=1900*dt;p.y+=p.vy*dt;
 if(p.y>=G-p.h){p.y=G-p.h;if(!p.g)burst(p.x+17,G,6,'#c2c3c7');p.vy=0;p.g=true;p.j=0}
 if(inv>0)inv-=dt;
 spawn-=dt;
 if(spawn<=0){const k=Math.random(),h=k<.5?28:k<.85?44:60,sp=k<.5;obs.push({x:W+20,w:sp?30:34,h,sp});if(Math.random()<.75)for(let i=0;i<3;i++)coins.push({x:W+20+(sp?15:17)+(i-1)*34,y:G-h-62-(i===1?22:0)});spawn=.45+(.75+Math.random()*.8)*(300/speed)}
 for(const o of obs)o.x-=speed*dt;
 for(const c of coins){c.x-=speed*dt;if(!c.t&&Math.hypot(p.x+17-c.x,p.y+17-c.y)<26){c.t=1;hap=.7;wallet++;runCoins++;saveW();combo++;score+=5*Math.min(5,1+Math.floor(combo/3));burst(c.x,c.y,8,'#f7931a');beep(600+Math.min(combo,10)*50,.06,'triangle')}else if(!c.t&&c.x<-12){c.t=1;combo=0}}
 coins=coins.filter(c=>!c.t&&c.x>-12);
 obs=obs.filter(o=>o.x+o.w>-10);
 if(inv<=0){
  const px=p.x+5,py=p.y+5,pw=p.w-10,ph=p.h-8;
  for(const o of obs){const ox=o.x+4,oy=G-o.h+4,ow=o.w-8;if(px<ox+ow&&px+pw>ox&&py<G&&py+ph>oy){die();break}}
 }
}

function draw(){
 cx.save();if(shake>0)cx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);const sk=SK[Math.floor(score/100)%4],g=cx.createLinearGradient(0,0,0,G);g.addColorStop(0,sk[0]);g.addColorStop(1,sk[1]);
 cx.fillStyle=g;cx.fillRect(-20,-20,W+40,H+40);
 cx.fillStyle=ink;
 for(const s of stars){cx.globalAlpha=s.a*(.7+.3*Math.sin(last/450+s.x));cx.fillRect((s.x-dist*.02+W*5)%W,s.y,s.s,s.s)}
 cx.globalAlpha=1;const mg=cx.createRadialGradient(280,96,20,280,96,95);mg.addColorStop(0,'rgba(255,248,215,'+(.28+.05*Math.sin(last/900))+')');mg.addColorStop(1,'rgba(255,248,215,0)');cx.fillStyle=mg;cx.fillRect(170,0,200,200);
 cx.drawImage(MOON,248,64,64,64);
 cx.fillStyle='rgba(20,18,40,.55)';cx.beginPath();cx.moveTo(0,G);
 for(let x=0;x<=W;x+=6)cx.lineTo(x,G-46-Math.sin((x+dist*.25)/46)*16-Math.sin((x+dist*.25)/17)*5);
 cx.lineTo(W,G);cx.fill();
 cx.fillStyle=cg;cx.fillRect(0,G,W,H-G);
 cx.fillStyle=acc;cx.fillRect(0,G,W,3);
 cx.fillStyle='rgba(255,241,232,.18)';
 for(let i=0;i<10;i++){cx.fillRect(((i*48-dist)%480+480)%480-20,G+22+(i%3)*18,20,3)}
 for(const o of obs){
  cx.fillStyle=hurt;
  if(o.sp){cx.beginPath();cx.moveTo(o.x,G);cx.lineTo(o.x+o.w/2,G-o.h);cx.lineTo(o.x+o.w,G);cx.fill()}
  else{cx.fillRect(o.x,G-o.h,o.w,o.h);cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(o.x+o.w-8,G-o.h,8,o.h)}
 }
 for(const c of coins)gcoin(cx,c.x,c.y,11,Math.max(.18,Math.abs(Math.cos(dist/28))));
 if(!(scr==='home'&&st==='ready')&&!(inv>0&&Math.floor(inv*10)%2)){
  const l=p.g&&st==='play'?Math.floor(dist/18)%2*4:0;drawAnimal(cx,skin,p.x,p.y,l,st==='over'?3:hap>0?2:last%2600<140?1:0,outfit);
 }
 for(const q of parts){cx.globalAlpha=Math.min(1,q.l*2.5);cx.fillStyle=q.c;cx.fillRect(q.x,q.y,4,4)}cx.globalAlpha=1;cx.fillStyle=ink;cx.font="700 24px Fredoka,sans-serif";cx.textAlign='left';cx.fillText(String(Math.floor(score)),16,34);
 cx.font="700 14px Fredoka,sans-serif";cx.fillText('BEST '+Math.floor(best),16,52);
 gcoin(cx,150,29,11);cx.fillStyle=ink;cx.font="700 16px Fredoka,sans-serif";cx.fillText(String(wallet),172,35);
 if(combo>=3){cx.textAlign='left';cx.fillStyle='#ffa300';cx.fillText('COMBO x'+Math.min(5,1+Math.floor(combo/3)),16,72)}
 if(flash>0){cx.globalAlpha=Math.min(1,flash);cx.fillStyle=hero;cx.font="700 26px Fredoka,sans-serif";cx.textAlign='center';cx.fillText('SPEED UP!',W/2,150-(1.4-flash)*14);cx.globalAlpha=1}
 if(st==='play'&&score<15){cx.globalAlpha=Math.min(1,(15-score)/5);cx.fillStyle=ink;cx.font="700 24px Fredoka,sans-serif";cx.textAlign='center';cx.fillText('TAP ANYWHERE TO JUMP',W/2,250);cx.globalAlpha=1}
 cx.restore();
}

function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();drawHome();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
(function(){var L=document.getElementById("load");if(!L)return;setTimeout(function(){var b=document.getElementById("lb");b.style.animation="none";b.style.width="100%";setTimeout(function(){L.style.opacity=0;setTimeout(function(){L.remove()},450)},300)},Math.max(0,1400-performance.now()))})();
</script>
